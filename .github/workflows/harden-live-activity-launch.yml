name: Harden Live Activity launch

on:
  push:
    branches: [feature/live-activity-task-ux]
    paths:
      - scripts/harden_live_activity_launch.py
      - .github/workflows/harden-live-activity-launch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-activity-task-ux
      - name: Harden launch routing
        run: python3 scripts/harden_live_activity_launch.py
      - name: Commit source changes
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CodegiOS/App/RootView.swift CodegiOS/App/AppModel.swift CodegiOS/Background/BackgroundAgentCoordinator.swift
          git diff --cached --check
          git commit -m "Harden cold Live Activity task routing"
          git push origin HEAD:feature/live-activity-task-ux
