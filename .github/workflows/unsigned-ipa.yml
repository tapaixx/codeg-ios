name: Unsigned iOS IPA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project CodegiOS.xcodeproj \
            -scheme CodegiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        id: package
        shell: bash
        run: |
          set -euxo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Codeg.app"
          test -d "$APP"
          test ! -d "$APP/_CodeSignature"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          BASENAME="Codeg-${VERSION}-${BUILD}-unsigned"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          ditto "$APP" "build/ipa/Payload/Codeg.app"
          (
            cd build/ipa
            zip -qry "${BASENAME}.ipa" Payload
            shasum -a 256 "${BASENAME}.ipa" > "${BASENAME}.ipa.sha256"
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.basename }}
          path: |
            build/ipa/${{ steps.package.outputs.basename }}.ipa
            build/ipa/${{ steps.package.outputs.basename }}.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tapaixx release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.1-tapaixx.4
          BASENAME: ${{ steps.package.outputs.basename }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD: ${{ steps.package.outputs.build }}
        run: |
          set -euxo pipefail
          IPA="build/ipa/${BASENAME}.ipa"
          SHA="build/ipa/${BASENAME}.ipa.sha256"

          cat > build/release-notes.md <<EOF
          ## Codeg iOS ${VERSION} (${BUILD}) — tapaixx Live Activity UX update

          - Sends the Codeg token in Authorization: Bearer during the native iOS WebSocket HTTP upgrade, matching normal API requests.
          - Advertises only the codeg-events WebSocket subprotocol instead of encoding the token into a browser-style custom subprotocol.
          - Trims surrounding whitespace/newlines from the WebSocket token before authentication.
          - Shows elapsed task time and meaningful phases instead of pretending an agent has a known completion percentage.
          - Throttles system Live Activity updates so the Dynamic Island can collapse naturally after backgrounding.
          - Tapping the system Live Activity routes to the active conversation or new task; multi-task taps open Activity.
          - Persists only non-sensitive routing and timing hints for launch restoration.
          - Keeps transparent post-attach reconnect, event replay, continued processing, and actionable background notifications.

          The attached IPA is **unsigned** and is intended for downstream signing/sideloading workflows.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" "$SHA" --clobber
            gh release edit "$TAG" --notes-file build/release-notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$IPA" "$SHA" \
              --title "Codeg iOS ${VERSION} (${BUILD}) - tapaixx" \
              --notes-file build/release-notes.md \
              --target "$GITHUB_SHA"
          fi
